<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Musai Music Maison</title>
<meta name="description" content="Musai Music Maison — Music by MUSAI.">

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<meta property="og:type" content="website">
<meta property="og:title" content="Musai Music Maison">
<meta property="og:description" content="Music by MUSAI.">
<meta property="og:image" content="https://music.akasakahasegawa.com/musai-music-maison-logo.png">
<meta property="og:url" content="https://music.akasakahasegawa.com/">
<meta property="og:site_name" content="Musai Music Maison">

<style>
:root{--navy:#071d63;--text:#111;--muted:#777;--line:#ddd;--bg:#f7f7f8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans",Arial,sans-serif}
.wrap{max-width:1100px;margin:auto;background:#fff;min-height:100vh;padding:34px}
.logo{display:block;width:min(100%,1000px);height:auto;margin:0 auto}
.nav{text-align:center;margin:22px 0 0;padding-top:18px;border-top:1px solid var(--line)}
.nav a{color:var(--navy);text-decoration:none;font-size:14px;letter-spacing:.16em;margin:0 14px}
.content{margin-top:42px}
.card{border:1px solid var(--line);border-radius:16px;padding:26px;background:#fff}
.card h2{font-family:Georgia,"Times New Roman",serif;font-size:25px;font-weight:400;margin:0 0 8px;color:var(--navy)}
.subtitle{color:var(--muted);margin-bottom:22px}
.albums{display:grid;gap:34px}
.album{display:grid;grid-template-columns:220px 1fr;gap:30px;align-items:center;padding-top:26px;border-top:1px solid var(--line)}
.album:first-child{padding-top:0;border-top:0}
.album-cover{width:100%;border-radius:12px;display:block}
.tracks{list-style:none;margin:0;padding:0}
.track{display:flex;align-items:center;border-top:1px solid var(--line);padding:14px 0;text-decoration:none;color:var(--text)}
.track:first-child{border-top:0}
.num{width:34px;color:var(--muted)}
.title{flex:1;font-size:17px}
.arrow{color:var(--navy)}
.button{display:inline-block;margin-top:20px;padding:11px 24px;border:1px solid var(--navy);color:var(--navy);text-decoration:none;letter-spacing:.12em;font-size:13px}
footer{text-align:center;color:#999;font-size:12px;margin-top:44px;padding-top:20px;border-top:1px solid var(--line)}
@media(max-width:760px){
.wrap{padding:18px}
.logo{width:100%}
.nav a{margin:0 7px;font-size:12px}
.album{grid-template-columns:1fr;gap:22px}
.album-cover{max-width:360px;margin:auto}
.content{margin-top:30px}
}
</style>
</head>
<body>
<div class="wrap">

<img class="logo" src="musai-music-maison-logo.png" alt="Musai Music Maison">

<nav class="nav" aria-label="Main navigation">
<a href="#albums">ALBUMS</a>
</nav>

<main class="content" id="albums">
<section class="card">
<h2>ALBUMS</h2>
<div class="albums">

<div class="album">
<div>
<a href="alis-ultra-fines/">
<img class="album-cover" src="alis-ultra-fines/cover.jpg" alt="ALIS ULTRA FINES album jacket">
</a>
</div>
<div>
<h2>ALIS ULTRA FINES</h2>
<div class="subtitle">MUSAI</div>
<ul class="tracks">
<li><a class="track" href="alis-ultra-fines/hikari/"><span class="num">01</span><span class="title">Hikari Is My Name</span><span class="arrow">→</span></a></li>
<li><a class="track" href="alis-ultra-fines/kimi-ga-sukida/"><span class="num">02</span><span class="title">君が好きだ</span><span class="arrow">→</span></a></li>
<li><a class="track" href="alis-ultra-fines/sei-exo-akira-exotics/"><span class="num">03</span><span class="title">聖EXO -Akira Exotics</span><span class="arrow">→</span></a></li>
</ul>
</div>
</div>





</div>

<div class="album">
<div><a href="坪さん歌/"><img class="album-cover" src="坪さん歌/cover.jpg" alt="坪さん歌 album jacket"></a></div>
<div><h2>坪さん歌</h2><div class="subtitle">MUSAI</div>
<ul class="tracks">
<li><a class="track" href="坪さん歌/未定義/"><span class="num">01</span><span class="title">未定義</span><span class="arrow">→</span></a></li>
<li><a class="track" href="坪さん歌/いいんじゃないの/"><span class="num">02</span><span class="title">いいんじゃないの -フィクションです</span><span class="arrow">→</span></a></li>
</ul></div></div>
<div class="album">
<div><a href="都の中心/"><img class="album-cover" src="都の中心/cover.jpg" alt="都の中心 album jacket"></a></div>
<div><h2>都の中心</h2><div class="subtitle">MUSAI</div>
<ul class="tracks">
<li><a class="track" href="都の中心/司っ子だからね/"><span class="num">01</span><span class="title">司っ子だからね</span><span class="arrow">→</span></a></li>
</ul></div></div>

</section>
</main>

<footer>© 2026 Musai Music Maison. All rights reserved.</footer>
</div>
</body>
</html>
