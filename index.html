<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Musai Music Maison</title>
<meta name="description" content="Musai Music Maison — MUSAI">
<meta name="theme-color" content="#ffffff">

<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<meta property="og:type" content="website">
<meta property="og:title" content="Musai Music Maison">
<meta property="og:description" content="MUSAI">
<meta property="og:image" content="https://music.akasakahasegawa.com/musai-icon-512.png">
<meta property="og:url" content="https://music.akasakahasegawa.com/">
<meta property="og:site_name" content="Musai Music Maison">

<style>
:root{--navy:#071b62;--text:#111;--muted:#777;--line:#d9d9de}
*{box-sizing:border-box}
body{margin:0;background:#f7f7f8;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans",Arial,sans-serif}
.wrap{min-height:100vh;background:#fff;display:flex;flex-direction:column}
.hero{min-height:calc(100vh - 72px);display:flex;align-items:center;justify-content:center;padding:50px 24px 70px}
.inner{width:min(1050px,100%);text-align:center}
.logo{display:block;width:min(900px,100%);height:auto;margin:0 auto 42px}
.enter{display:inline-block;padding:15px 62px;border:1px solid var(--navy);color:var(--navy);text-decoration:none;font-size:15px;letter-spacing:.28em;transition:.2s}
.enter:hover{background:var(--navy);color:#fff}
.footer{border-top:1px solid var(--line);padding:22px 24px;text-align:center;color:var(--muted);font-size:12px;letter-spacing:.18em}
@media(max-width:700px){
.hero{min-height:calc(100vh - 60px);padding:30px 18px 55px}
.logo{margin-bottom:32px}
.enter{padding:14px 48px;font-size:14px}
.footer{padding:18px}
}
</style>
</head>
<body>
<div class="wrap">
<main class="hero">
<div class="inner">
<img class="logo" src="musai-music-maison-logo.png" alt="Musai Music Maison">
<a class="enter" href="alis-ultra-fines/">ENTER</a>
</div>
</main>
<footer class="footer">MUSAI</footer>
</div>
</body>
</html>
