<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hikari Is My Name — MUSAI</title>
<meta name="description" content="Hikari Is My Name — MUSAI">
<meta property="og:type" content="music.song">
<meta property="og:title" content="Hikari Is My Name — MUSAI">
<meta property="og:description" content="ALIS ULTRA FINES">
<meta property="og:image" content="https://music.akasakahasegawa.com/alis-ultra-fines/cover.jpg">
<meta property="og:url" content="https://music.akasakahasegawa.com/alis-ultra-fines/hikari/">
<style>

:root{--red:#fa2439;--text:#111;--muted:#777;--line:#ddd;--bg:#f7f7f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans",Arial,sans-serif}
.wrap{max-width:1100px;margin:auto;background:white;min-height:100vh;padding:34px}
.hero{display:grid;grid-template-columns:minmax(280px,460px) 1fr;gap:42px;align-items:center}
.cover{width:100%;aspect-ratio:1;border-radius:20px;object-fit:cover;box-shadow:0 12px 30px #0002}
h1{font-size:38px;margin:0 0 8px}.artist{font-size:24px;color:var(--red);margin-bottom:24px}
button{border:0;border-radius:22px;padding:12px 24px;font-weight:700;cursor:pointer}
.play{background:var(--red);color:white;font-size:17px}.sub{background:#eee;margin-left:8px}
.meta{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted)}
.credits{line-height:1.8;margin-top:18px}
.content{display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-top:38px}
.card{border:1px solid var(--line);border-radius:16px;padding:24px;background:white}
.card h2{font-size:21px;margin:0 0 20px}
.lyrics{height:570px;overflow:auto;scroll-behavior:smooth}
.line{font-size:21px;line-height:1.75;color:#aaa;padding:3px 0;transition:.18s}
.line.active{color:var(--text);font-weight:700;transform:scale(1.01);transform-origin:left}
.note{font-size:17px;line-height:1.9}
.player{position:sticky;bottom:0;margin:28px -34px -34px;padding:15px 34px;background:#fffefeed;backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.seek{width:100%}.time{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
audio{width:100%;margin-top:8px}
@media(max-width:760px){.wrap{padding:18px}.hero,.content{grid-template-columns:1fr;gap:22px}h1{font-size:30px}.artist{font-size:20px}.lyrics{height:430px}.line{font-size:19px}.player{margin:22px -18px -18px;padding:12px 18px}}

.controls {
  display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin:18px 0 26px;
}
.controls a {
  text-decoration:none; padding:9px 16px; border-radius:20px;
  background:rgba(128,128,128,.12); color:inherit; font-size:14px;
}
.controls a:hover { background:rgba(128,128,128,.2); }
</style>
</head>
<body>
<div class="container">
  <div class="album-art">
    <img src="../cover.jpg" alt="ALIS ULTRA FINES album jacket">
  </div>
  <h1>Hikari Is My Name</h1>
  <div class="artist">MUSAI</div>
  <audio id="audio" controls>
    <source src="Hikari Is My Name.mp3" type="audio/mpeg">
  </audio>
  <div class="controls">
    <a href="../">← ALIS ULTRA FINES</a>
    <a href="Hikari Is My Name.mp3" download>↓ Download</a>
  </div>
  <div id="lyrics"></div>
</div>
<script>
const lrc = `[00:00]明日が来れば　また走り出す
[00:08]鼓動と汗と　飛べる気分
[00:15]両手広げて　駆け上がる道
[00:21]襟の桜は　いつも春の色
[00:29]ねぇ目覚めて　遠くにいるの
[00:36]君の声が　聞こえてくるでしょう
[00:43]太陽の力を　名前に変えたから
[00:50]これから行く道差して　教えてください
[00:57]私の力を　優しさに変えたなら
[01:04]君の行く空で見つけて　Hikari is my name
[01:24]夢の彼方に　また踊り出す
[01:32]調べと歌と　舞える気分
[01:39]足ばやに急げ　メイプルの坂
[01:46]レンガの壁超えて　赤くなれ
[01:53]ねえ話して　そばにいるの
[02:01]君の笑みが見えて　くるでしょう
[02:08]太陽の心を　名前に変えたから
[02:15]これから会う君探して　走ります
[02:22]私の心を　強さに変えたなら
[02:29]君のいる海で輝け　Hikari is my name`;
const lines = lrc.split("\n").map(line => {
  const m = line.match(/^\[(\d+):(\d+(?:\.\d+)?)\](.*)$/);
  return m ? {time:Number(m[1])*60+Number(m[2]), text:m[3]} : null;
}).filter(Boolean);

const lyricsBox = document.getElementById("lyrics");
lines.forEach((line, i) => {
  const el = document.createElement("div");
  el.className = "lyric";
  el.textContent = line.text;
  el.dataset.index = i;
  lyricsBox.appendChild(el);
});

const audio = document.getElementById("audio");
audio.addEventListener("timeupdate", () => {
  let active = -1;
  for (let i=0; i<lines.length; i++) {
    if (audio.currentTime >= lines[i].time) active = i;
  }
  document.querySelectorAll(".lyric").forEach((el,i) => {
    el.classList.toggle("active", i === active);
  });
  if (active >= 0) {
    document.querySelectorAll(".lyric")[active].scrollIntoView({behavior:"smooth", block:"center"});
  }
});
</script>
</body>
</html>
