<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>君が好きだ — MUSAI</title>
<style>
:root{--red:#fa2439;--text:#111;--muted:#777;--line:#ddd;--bg:#fff}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
body{padding-bottom:105px}
.wrap{max-width:900px;margin:0 auto;padding:0 32px 42px}
.cover{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:0 0 20px 20px}
h1{font-size:42px;line-height:1.1;margin:42px 0 8px;font-weight:700;letter-spacing:-.03em}
.artist{font-size:30px;color:var(--red);margin-bottom:34px}
.actions{display:flex;gap:14px;margin-bottom:44px}
button{border:0;font:inherit;font-weight:600;cursor:pointer}
.play-btn{background:var(--red);color:#fff;border-radius:42px;padding:16px 30px;font-size:18px;min-width:170px}
.reset-btn{background:#eee;color:#1683e6;border-radius:42px;padding:16px 27px;font-size:17px}
.divider{border-top:1px solid var(--line);margin-bottom:34px}
.meta{font-size:24px;color:#777;margin-bottom:42px}
.credits{font-size:20px;line-height:2;margin-bottom:30px}
.back,.download{display:block;text-decoration:none;font-size:20px;margin:20px 0}
.back{color:var(--red);font-weight:600}
.download{color:var(--text)}
.lyrics-card{border:1px solid #d9d9d9;border-radius:20px;padding:28px 28px 30px;margin-top:70px}
.lyrics-card h2{font-size:28px;margin:0 0 24px}
.lyrics{max-height:620px;overflow-y:auto;padding-right:6px}
.lyric-line{font-size:22px;line-height:1.8;margin:0 0 10px;padding:3px 8px;border-radius:8px;transition:.15s}
.lyric-line.active{color:var(--red);font-weight:650;background:#fff1f3}
.player{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.97);border-top:1px solid #ddd;padding:12px 32px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}
.player audio{display:block;width:100%;max-width:900px;margin:0 auto}
@media(max-width:700px){.wrap{padding:0 32px 30px}.cover{width:calc(100% + 64px);max-width:none;margin-left:-32px;border-radius:0 0 18px 18px}h1{font-size:38px;margin-top:42px}.artist{font-size:29px;margin-bottom:34px}.actions{margin-bottom:44px}.play-btn{padding:15px 27px;min-width:171px}.reset-btn{padding:15px 25px}.meta{font-size:23px;margin-bottom:40px}.credits{font-size:20px}.back,.download{font-size:20px}.lyrics-card{margin-top:70px;padding:27px 28px}.lyric-line{font-size:22px}.player{padding-left:32px;padding-right:32px}}
@media(max-width:430px){.wrap{padding-left:32px;padding-right:32px}.cover{width:calc(100% + 64px);margin-left:-32px}h1{font-size:36px}.actions{gap:12px}.play-btn{min-width:0;padding:15px 25px}.reset-btn{padding:15px 22px}}
</style>
</head>
<body>
<div class="wrap">
<img class="cover" src="../cover.jpg" alt="ALIS ULTRA FINES">
<h1>君が好きだ</h1>
<div class="artist">MUSAI</div>
<div class="actions">
<button class="play-btn" id="playButton">▶ 再生</button>
<button class="reset-btn" id="resetButton">↻ 最初から</button>
</div>
<div class="divider"></div>
<div class="meta">1曲　・　約3分</div>
<div class="credits">作詞・作曲：MUSAI<br>編曲・演奏：Suno</div>
<a class="back" href="../">← ALIS ULTRA FINES</a>
<a class="download" href="君が好きだ.mp3" download>MP3をダウンロード</a>
<section class="lyrics-card">
<h2>歌詞</h2>
<div class="lyrics" id="lyrics">
<div class="lyric-line" data-time="17.00">太陽が昇る</div>
<div class="lyric-line" data-time="21.00">湖の彼方から</div>
<div class="lyric-line" data-time="26.00">通り行く光線で</div>
<div class="lyric-line" data-time="29.00">コーヒーの湯気が揺れる</div>
<div class="lyric-line" data-time="33.00">今、電話切ったとこさ</div>
<div class="lyric-line" data-time="37.00">声が耳に残るよ</div>
<div class="lyric-line" data-time="41.00">朝の摩天楼見つめて</div>
<div class="lyric-line" data-time="45.00">僕の時間が止まる</div>
<div class="lyric-line" data-time="50.00">君が好きだ</div>
<div class="lyric-line" data-time="53.00">時差を超えて突き抜ける</div>
<div class="lyric-line" data-time="57.00">東京まで飛んで行け</div>
<div class="lyric-line" data-time="61.00">僕の声　僕の歌</div>
<div class="lyric-line" data-time="100.00">夕日が沈む</div>
<div class="lyric-line" data-time="104.00">東京の君の窓</div>
<div class="lyric-line" data-time="108.00">遠く霞む街</div>
<div class="lyric-line" data-time="112.00">映るスタンドの灯り</div>
<div class="lyric-line" data-time="117.00">今、何してるのかな</div>
<div class="lyric-line" data-time="121.00">君も空を見てるかな</div>
<div class="lyric-line" data-time="124.00">長い夜を越えるたびに</div>
<div class="lyric-line" data-time="128.00">君の笑みが浮かぶ</div>
<div class="lyric-line" data-time="133.00">君が好きだ</div>
<div class="lyric-line" data-time="136.00">海を超えて突き抜ける</div>
<div class="lyric-line" data-time="140.00">東京まで届けたい</div>
<div class="lyric-line" data-time="144.00">僕の声　僕の歌</div>
</div>
</section>
</div>
<div class="player">
<audio id="audio" controls preload="metadata" src="君が好きだ.mp3"></audio>
</div>
<script>
const audio = document.getElementById('audio');
const playButton = document.getElementById('playButton');
const resetButton = document.getElementById('resetButton');
const lyricBox = document.getElementById('lyrics');
const lines = [...document.querySelectorAll('.lyric-line')];

playButton.addEventListener('click', async () => {
  if (audio.paused) {
    try { await audio.play(); } catch(e) {}
  } else {
    audio.pause();
  }
});
resetButton.addEventListener('click', () => {
  audio.currentTime = 0;
  audio.play().catch(() => {});
});
audio.addEventListener('play', () => { playButton.textContent = '❚❚ 再生中'; });
audio.addEventListener('pause', () => { playButton.textContent = '▶ 再生'; });
function syncLyrics() {
  const t = audio.currentTime;
  let active = -1;
  for (let i = 0; i < lines.length; i++) {
    if (parseFloat(lines[i].dataset.time) <= t) active = i;
    else break;
  }
  lines.forEach((el, i) => el.classList.toggle('active', i === active));
  if (active >= 0) {
    const box = lyricBox.getBoundingClientRect();
    const el = lines[active].getBoundingClientRect();
    if (el.top < box.top + 35 || el.bottom > box.bottom - 35) {
      lines[active].scrollIntoView({behavior:'smooth',block:'center'});
    }
  }
}
audio.addEventListener('timeupdate', syncLyrics);
</script>
</body>
</html>
