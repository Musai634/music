<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALIS ULTRA FINES — MUSAI</title>
<meta name="description" content="ALIS ULTRA FINES — MUSAI">
<style>
:root{--red:#fa2439;--text:#111;--muted:#777;--line:#ddd;--bg:#f7f7f8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:34px}
.hero{display:grid;grid-template-columns:minmax(280px,460px) 1fr;gap:42px;align-items:start}
.cover{width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:38px;font-weight:400;margin:12px 0 8px}
.artist{font-size:17px;color:var(--muted)}
.tagline{margin-top:18px;color:#555;line-height:1.7}
.content{margin-top:36px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
.card h2{font-size:18px;margin:0 0 16px}
.track{display:flex;align-items:center;gap:16px;padding:16px 4px;border-top:1px solid var(--line);text-decoration:none;color:var(--text)}
.track:first-of-type{border-top:0}
.num{color:var(--muted);width:28px}
.track-title{flex:1;font-size:17px}
.play{color:var(--red);font-size:14px}
footer{text-align:center;color:#999;font-size:13px;margin-top:34px}
@media(max-width:760px){
.wrap{padding:18px}
.hero{grid-template-columns:1fr}
h1{font-size:30px}
.content{margin-top:28px}
}
</style>
</head>
<body>
<div class="wrap">
<div class="hero">
<div>
<img class="cover" src="cover.jpg" alt="ALIS ULTRA FINES album jacket">
</div>
<div>
<h1>ALIS ULTRA FINES</h1>
<div class="artist">MUSAI</div>
<div class="tagline">With wings beyond the boundaries.</div>
</div>
</div>

<div class="content">
<div class="card">
<h2>Tracks</h2>

<a class="track" href="hikari/">
<span class="num">01</span>
<span class="track-title">Hikari Is My Name</span>
<span class="play">▶</span>
</a>

<a class="track" href="kimi-ga-sukida/">
<span class="num">02</span>
<span class="track-title">君が好きだ</span>
<span class="play">▶</span>
</a>

<a class="track" href="sei-exo-akira-exotics/">
<span class="num">03</span>
<span class="track-title">聖EXO -Akira Exotics</span>
<span class="play">▶</span>
</a>

<a class="track" href="未定義/">
<span class="num">04</span>
<span class="track-title">未定義</span>
<span class="play">▶</span>
</a>

</div>
</div>

<footer>Music by MUSAI</footer>
</div>
</body>
</html>
