<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>都の中心 — MUSAI</title>
<meta name="description" content="都の中心 — MUSAI">
<meta property="og:type" content="music.album">
<meta property="og:title" content="都の中心 — MUSAI">
<meta property="og:description" content="司っ子だからね">
<meta property="og:image" content="https://music.akasakahasegawa.com/都の中心/cover.jpg">
<meta property="og:url" content="https://music.akasakahasegawa.com/都の中心/">
<meta property="og:site_name" content="Musai Music Maison">
<style>
:root{--red:#fa2439;--text:#111;--muted:#777;--line:#ddd;--bg:#f7f7f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans",Arial,sans-serif}
.wrap{max-width:1100px;margin:auto;background:white;min-height:100vh;padding:34px}
.hero{display:grid;grid-template-columns:minmax(280px,460px) 1fr;gap:42px;align-items:center}
.cover{width:100%;aspect-ratio:1;border-radius:20px;object-fit:cover;box-shadow:0 12px 30px #0002}
h1{font-size:38px;margin:0 0 8px}.artist{font-size:24px;color:var(--red);margin-bottom:24px}
.meta{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted)}
.credits{line-height:1.8;margin-top:18px}.album-link{display:inline-block;margin-top:14px;color:var(--red);text-decoration:none;font-weight:700}
.card{border:1px solid var(--line);border-radius:16px;padding:24px;background:white;margin-top:38px}.card h2{font-size:21px;margin:0 0 20px}
.track{display:flex;align-items:center;border-top:1px solid var(--line);padding:14px 0;text-decoration:none;color:var(--text)}
.track:first-of-type{border-top:0}.num{width:40px;color:var(--muted)}.title{flex:1}.arrow{color:var(--red)}
@media(max-width:760px){.wrap{padding:18px}.hero{grid-template-columns:1fr;gap:22px}h1{font-size:30px}.artist{font-size:20px}}
</style>
</head>
<body><div class="wrap">
<section class="hero">
<img class="cover" src="cover.jpg" alt="都の中心 ジャケット">
<div><h1>都の中心</h1><div class="artist">MUSAI</div>
<div class="meta">1曲</div><div class="credits">司っ子だからね</div>
<a class="album-link" href="../">← Musai Music Maison</a></div>
</section>
<section class="card"><h2>TRACKS</h2>
<a class="track" href="司っ子だからね/"><span class="num">01</span><span class="title">司っ子だからね</span><span class="arrow">→</span></a>
</section>
</div></body></html>
