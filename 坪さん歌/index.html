<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>坪さん歌 — MUSAI</title>
<meta name="description" content="坪さん歌 — MUSAI">
<style>
:root{--green:#238b45;--text:#111;--muted:#777;--line:#ddd;--bg:#f7f7f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans",Arial,sans-serif}
.wrap{max-width:1100px;margin:auto;background:white;min-height:100vh;padding:34px}
.hero{display:grid;grid-template-columns:minmax(280px,460px) 1fr;gap:42px;align-items:center}
.cover{width:100%;aspect-ratio:1;border-radius:20px;object-fit:cover;box-shadow:0 12px 30px #0002}
h1{font-size:38px;margin:0 0 8px}.artist{font-size:24px;color:var(--green);margin-bottom:24px}
.meta{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted)}
.credits{line-height:1.8;margin-top:18px}.album-link{display:inline-block;margin-top:14px;color:var(--green);text-decoration:none;font-weight:700}
.download{display:inline-block;margin-top:12px;color:var(--text);text-decoration:none}
.card{border:1px solid var(--line);border-radius:16px;padding:24px;background:white;margin-top:38px}
.card h2{font-size:21px;margin:0 0 20px}.lyrics{line-height:1.75}.line{font-size:21px;color:#aaa;padding:3px 0}.line.active{color:var(--text);font-weight:700}
.player{position:sticky;bottom:0;margin:28px -34px -34px;padding:15px 34px;background:#fffefeed;backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.seek{width:100%}.time{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}audio{width:100%;margin-top:8px}
@media(max-width:760px){.wrap{padding:18px}.hero{grid-template-columns:1fr;gap:22px}h1{font-size:30px}.artist{font-size:20px}.player{margin:22px -18px -18px;padding:12px 18px}}
</style>
</head>
<body><div class="wrap">
<section class="hero">
<img class="cover" src="cover.jpg" alt="坪さん歌 ジャケット">
<div><h1>坪さん歌</h1><div class="artist">MUSAI</div>
<div class="meta">2曲</div>
<div class="credits">俺とお前とあいつらの賛歌</div>
<a class="album-link" href="../">← Musai Music Maison</a></div>
</section>
<div class="card">
<h2>TRACKS</h2>

</div>
</div></body></html>
