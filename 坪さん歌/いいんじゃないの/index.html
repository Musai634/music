<style>

.wrap { max-width:1100px; margin:0 auto; background:#fff; min-height:100vh; padding:34px; }

</head>

  {time: 173, text: 'いいんじゃないの'},
  {time: 175, text: 'そんなこと'},
  {time: 180, text: 'そんなこと'}
];
const audio = document.getElementById("audio");
const lyricsEl = document.getElementById("lyrics");

for (const line of lyrics) {
  const div = document.createElement("div");
  div.className = "lyric-line";
  div.textContent = line.text;
  lyricsEl.appendChild(div);
}

const lyricElements = Array.from(document.querySelectorAll(".lyric-line"));

function updateLyrics() {
  const t = audio.currentTime;
  let activeIndex = -1;

  for (let i = 0; i < lyrics.length; i++) {
    if (t >= lyrics[i].time) {
      activeIndex = i;
    } else {
      break;
    }
  }

  lyricElements.forEach((el, i) => {
    el.classList.toggle("active", i === activeIndex);
  });

  if (activeIndex >= 0) {
    lyricElements[activeIndex].scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
  }
}

audio.addEventListener("timeupdate", updateLyrics);
audio.addEventListener("seeking", updateLyrics);
audio.addEventListener("loadedmetadata", updateLyrics);
audio.addEventListener("play", updateLyrics);
audio.addEventListener("pause", updateLyrics);
</script>
