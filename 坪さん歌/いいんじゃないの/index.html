<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>いいんじゃないの -フィクションです — MUSAI</title>
<meta name="description" content="いいんじゃないの -フィクションです — MUSAI">
<meta property="og:type" content="music.song">
<meta property="og:title" content="いいんじゃないの -フィクションです — MUSAI">
<meta property="og:description" content="坪さん歌 — 武蔵高校の仲間たちの歌">
<meta property="og:image" content="https://music.akasakahasegawa.com/alis-ultra-fines/cover.jpg">
<meta property="og:image:alt" content="ALIS ULTRA FINES album jacket">
<meta property="og:url" content="https://music.akasakahasegawa.com/tsubosan/ii-njanaino/">
<style>

:root{--red:#fa2439;--text:#111;--muted:#777;--line:#ddd;--bg:#f7f7f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans",Arial,sans-serif}
.wrap{max-width:1100px;margin:auto;background:white;min-height:100vh;padding:34px}
.hero{display:grid;grid-template-columns:minmax(280px,460px) 1fr;gap:42px;align-items:center}
.cover{width:100%;aspect-ratio:1;border-radius:20px;object-fit:cover;box-shadow:0 12px 30px #0002}
h1{font-size:38px;margin:0 0 8px}.artist{font-size:24px;color:var(--red);margin-bottom:24px}
button{border:0;border-radius:22px;padding:12px 24px;font-weight:700;cursor:pointer}
.play{background:var(--red);color:white;font-size:17px}.sub{background:#eee;margin-left:8px}
.meta{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted)}
.credits{line-height:1.8;margin-top:18px}
.content{display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-top:38px}
.card{border:1px solid var(--line);border-radius:16px;padding:24px;background:white}
.card h2{font-size:21px;margin:0 0 20px}
.lyrics{height:570px;overflow:auto;scroll-behavior:smooth}
.line{font-size:21px;line-height:1.75;color:#aaa;padding:3px 0;transition:.18s}
.line.active{color:var(--text);font-weight:700;transform:scale(1.01);transform-origin:left}
.note{font-size:17px;line-height:1.9}
.player{position:sticky;bottom:0;margin:28px -34px -34px;padding:15px 34px;background:#fffefeed;backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.seek{width:100%}.time{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
audio{width:100%;margin-top:8px}
@media(max-width:760px){.wrap{padding:18px}.hero,.content{grid-template-columns:1fr;gap:22px}h1{font-size:30px}.artist{font-size:20px}.lyrics{height:430px}.line{font-size:19px}.player{margin:22px -18px -18px;padding:12px 18px}}

.album-link{display:inline-block;margin-top:14px;color:var(--red);text-decoration:none;font-weight:700}
.download{display:inline-block;margin-top:12px;color:var(--text);text-decoration:none}
@media(max-width:760px){.cover{max-width:100%;width:100%;height:auto}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
<img class="cover" src="../cover.jpg" alt="ALIS ULTRA FINES ジャケット">
<div>
<h1>いいんじゃないの -フィクションです</h1>
<div class="artist">MUSAI</div>
<button class="play" id="play">▶ 再生</button><button class="sub" id="restart">↺ 最初から</button>
<div class="meta">1曲　·　約3分25秒</div>
<div class="credits">作詞：久保田健嗣<br>作曲：長谷川斉<br>編曲・演奏：AI</div>
<a class="album-link" href="../">← 坪さん歌</a><br>
<a class="download" href="いいんじゃないの.mp3" download>MP3をダウンロード</a>
</div>
</section>
<section class="content">
<div class="card">
<h2>歌詞</h2>
<div class="lyrics" id="lyrics"></div>
</div>
<div>
<div class="card">
<h2>坪さん歌</h2>
<p class="note">With wings beyond the boundaries.</p>
</div>
</div>
</section>
<div class="player">
<div class="time"><span id="cur">0:00</span><span>3:??</span></div>
<audio id="audio" controls preload="metadata"><source src="いいんじゃないの.mp3" type="audio/mpeg"></audio>
</div>
</div>
<script>
const lrc = `[00:00.0]行くぜ
[00:00.0]ロッカーってさ
[00:00.0]本当はね
[00:00.0]チョット違うんだよね
[00:00.0]体に電気つけるって
[00:00.0]ステージでね
[00:00.0]ライダーってさ
[00:00.0]本当はね
[00:00.0]チョット違うんだよね
[00:00.0]足がとどかないって
[00:00.0]道路にさ
[00:00.0]カッコいいかって
[00:00.0]聞かれても
[00:00.0]なんて言ったらいいのさ
[00:00.0]還暦超えたおじいちゃんに
[00:00.0]そりゃあんた失礼さ
[00:00.0]いいんじゃないの
[00:00.0]そんなこと
[00:00.0]自分の気分が良ければ
[00:00.0]いいんじゃないの
[00:00.0]そんなこと
[00:00.0]見てくれよりも中身でしょ
[00:00.0]いいんじゃないの
[00:00.0]そんなこと
[00:00.0]昔はジッタさんよりモテたって
[00:00.0](いいんじゃないの)
[00:00.0](そんなこと)
[00:00.0]サーファーってさ
[00:00.0]本当はね
[00:00.0]チョット違うんだよね
[00:00.0]短いボード抱えて
[00:00.0]おばちゃんナンパして
[00:00.0]スキーヤーってね
[00:00.0]本当はね
[00:00.0]チョット違うんだよね
[00:00.0]サングラスかけてるって
[00:00.0]吹雪いてるのにね
[00:00.0]カッコいいかって
[00:00.0]聞かれても
[00:00.0]なんて言ったらいいのさ
[00:00.0]還暦超えたおじいちゃんに
[00:00.0]そりゃあんた失礼さ
[00:00.0]いいんじゃないの
[00:00.0]そんなこと
[00:00.0]自分の気分が良ければ
[00:00.0]いいんじゃないの
[00:00.0]そんなこと
[00:00.0]見てくれよりも中身でしょ
[00:00.0]いいんじゃないの
[00:00.0]そんなこと
[00:00.0]昔はかずふみより決めてたって
[00:00.0](いいんじゃないの)
[00:00.0](そんなこと)`;

const audio=document.getElementById('audio'), box=document.getElementById('lyrics');
const rows=lrc.trim().split('\n').map((s,i)=>{const m=s.match(/^\[(\d+):(\d+(?:\.\d+)?)\](.*)$/);return {t:+m[1]*60 + +m[2],text:m[3],i};});
rows.forEach(r=>{const d=document.createElement('div');d.className='line';d.textContent=r.text;d.dataset.i=r.i;box.appendChild(d)});
let active=-1;
audio.addEventListener('loadedmetadata',()=>{
 const dur=audio.duration; const m=Math.floor(dur/60); const s=Math.floor(dur%60).toString().padStart(2,'0');
 document.querySelector('.time span:last-child').textContent=m+':'+s;
});
audio.addEventListener('timeupdate',()=>{
 const m=Math.floor(audio.currentTime/60), s=Math.floor(audio.currentTime%60).toString().padStart(2,'0');
 document.getElementById('cur').textContent=m+':'+s;
 let n=-1;for(let i=0;i<rows.length;i++)if(audio.currentTime>=rows[i].t)n=i;
 if(n!==active){active=n;document.querySelectorAll('.line').forEach((e,i)=>e.classList.toggle('active',i===n));
 if(n>=0)box.children[n]?.scrollIntoView({behavior:'smooth',block:'center'});}
});
document.getElementById('play').onclick=()=>audio.paused?audio.play():audio.pause();
document.getElementById('restart').onclick=()=>{audio.currentTime=0;audio.play()};
audio.addEventListener('play',()=>document.getElementById('play').textContent='❚❚ 停止');
audio.addEventListener('pause',()=>document.getElementById('play').textContent='▶ 再生');
</script>
</body>
</html>
