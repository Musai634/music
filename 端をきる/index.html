<style>
:root{--red:#238b45;--text:#111;--muted:#777;--line:#ddd;--bg:#f7f7f8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans",Arial,sans-serif}
.wrap{max-width:1100px;margin:auto;background:white;min-height:100vh;padding:34px}
.hero{display:grid;grid-template-columns:minmax(280px,460px) 1fr;gap:42px;align-items:center}
.cover{width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px;box-shadow:0 12px 30px #0002}
h1{font-size:38px;margin:0 0 8px}.artist{font-size:24px;color:var(--red);margin-bottom:24px}
.tagline{font-size:17px;line-height:1.9;color:#555}
.content{margin-top:38px}
.card{border:1px solid var(--line);border-radius:16px;padding:24px;background:white}
.card h2{font-size:21px;margin:0 0 20px}
.track{display:flex;align-items:center;gap:16px;padding:16px 4px;border-top:1px solid var(--line);text-decoration:none;color:var(--text)}
.track:first-of-type{border-top:0}
.num{color:var(--muted);width:32px}
.track-title{flex:1;font-size:17px}
.duration{color:var(--muted);font-size:14px;min-width:48px;text-align:right}
.play{color:var(--red);font-size:14px;width:18px;text-align:right}
.back{display:inline-block;margin-top:24px;padding:11px 20px;border-radius:22px;background:var(--red);color:white;text-decoration:none;font-weight:700}
footer{text-align:center;color:#999;font-size:13px;margin-top:34px}
@media(max-width:760px){.wrap{padding:18px}.hero{grid-template-columns:1fr;gap:22px}h1{font-size:30px}.content{margin-top:28px}.track-title{font-size:16px}}
.floating-brand{position:fixed;right:24px;bottom:24px;z-index:10;display:block;width:128px;line-height:0}.floating-brand img{display:block;width:100%;height:auto}@media(max-width:760px){.floating-brand{right:14px;bottom:16px;width:112px}}
</style>
</head>
